<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARISE TODO v0.5</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--line:#ddd;--text:#171717}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}.wrap{max-width:1100px;margin:auto;padding:14px}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;margin:0 8px 0 0}.grow{flex:1;min-width:220px;padding:10px;border:1px solid #bbb;border-radius:9px}
.btn{padding:9px 11px;border:1px solid #bbb;background:#fff;border-radius:9px;cursor:pointer}.primary{background:#222;color:#fff;border-color:#222}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}.card h2{font-size:15px;margin:0;padding:10px 12px;border-bottom:1px solid #eee}
.item{padding:10px 12px;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.mainrow,.subrow{display:flex;gap:8px;align-items:flex-start}
.maincheck{width:18px;height:18px;margin-top:3px}
.subcheck{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin-top:3px;border:1.6px solid #8b8b8b;border-radius:50%;background:#fff;display:grid;place-content:center;cursor:pointer}
.subcheck:checked{background:#222;border-color:#222}
.subcheck:checked::after{content:'✓';color:#fff;font-size:12px;line-height:1;font-weight:700}
.submarker{color:#999;font-size:14px;line-height:20px;user-select:none}.drag{border:0;background:transparent;padding:1px 2px;font-size:17px;line-height:18px;cursor:grab;color:#888;user-select:none}.drag:active{cursor:grabbing}.item.dragging{opacity:.45}.toggle{border:0;background:transparent;padding:1px 2px;font-size:18px;line-height:18px;cursor:pointer;color:#555}
.text{flex:1;min-width:0}.title{font-weight:600}.done .title,.subdone .subtitle{text-decoration:line-through;color:#888}
.meta{font-size:11px;color:#888;margin-top:3px}.toolbar{display:flex;gap:6px}.mini{padding:6px 8px;border:1px solid #ccc;border-radius:7px;background:#fff;cursor:pointer}
.subs{margin:8px 0 0 44px;padding:8px 0 0 10px;border-left:2px solid #eee}.subs.hidden{display:none}.subrow{padding:6px 0}.subtitle{flex:1}
.subadd{display:flex;gap:6px;margin-top:7px}.subadd input{flex:1;min-width:0;padding:7px 8px;border:1px solid #ccc;border-radius:7px}.empty{padding:18px;color:#777}
@media(max-width:650px){.toolbar{padding-left:44px;width:100%}.subadd{flex-wrap:wrap}}
</style></head>
<body><div class="wrap">
<div class="top"><h1>✅ ARISE TODO v0.5</h1>
<input id="newText" class="grow" placeholder="할 일을 바로 입력"><button id="addBtn" class="btn primary">추가</button>
<input id="search" class="grow" placeholder="검색"><select id="sort" class="btn"><option value="custom">사용자 지정순</option><option value="new">최신 작성순</option><option value="old">오래된 작성순</option><option value="name">가나다순</option></select></div>
<div class="card"><h2>미완료</h2><div id="active"></div></div>
<div class="card"><h2>완료</h2><div id="done"></div></div>
</div>
<script>
const KEY='ariseTodoV03', OLD1='ariseTodoV02', OLD0='ariseTodoV01', SORT='ariseTodoSortV03';let items=[];
const $=x=>document.getElementById(x);function uid(p='t'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function load(){try{let raw=localStorage.getItem(KEY);if(raw)items=JSON.parse(raw)||[];else{let old=JSON.parse(localStorage.getItem(OLD1)||localStorage.getItem(OLD0)||'[]');items=Array.isArray(old)?old.map(x=>({...x,subs:Array.isArray(x.subs)?x.subs:[],open:false})):[];save()}}catch(e){items=[]}items.forEach((x,i)=>{if(!Array.isArray(x.subs))x.subs=[];if(typeof x.open!=='boolean')x.open=false;if(typeof x.order!=='number')x.order=i})}
function save(){localStorage.setItem(KEY,JSON.stringify(items))}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function filtered(){let q=$('search').value.trim().toLowerCase(),a=items.filter(x=>!q||x.text.toLowerCase().includes(q)||x.subs.some(s=>s.text.toLowerCase().includes(q)));let s=$('sort').value;return a.sort((x,y)=>s==='custom'?(x.order??0)-(y.order??0):s==='old'?new Date(x.createdAt)-new Date(y.createdAt):s==='name'?x.text.localeCompare(y.text,'ko'):new Date(y.createdAt)-new Date(x.createdAt))}
function build(x){
 let d=document.createElement('div');d.className='item'+(x.done?' done':'');d.draggable=true;d.dataset.id=x.id;
 d.innerHTML=`<div class="mainrow"><input class="maincheck" type="checkbox" ${x.done?'checked':''}><span class="drag" title="드래그로 순서 변경">⋮⋮</span><button class="toggle" title="하위 할일 열기/접기">${x.open?'▾':'▸'}</button><div class="text"><div class="title">${esc(x.text)}</div><div class="meta">${new Date(x.createdAt).toLocaleString('ko-KR')}</div></div><div class="toolbar"><button class="mini edit">수정</button><button class="mini del">삭제</button></div></div><div class="subs ${x.open?'':'hidden'}"><div class="sublist"></div><div class="subadd"><input placeholder="하위 할일 입력"><button class="mini addsub">추가</button></div></div>`;
 d.querySelector('.maincheck').onchange=e=>{x.done=e.target.checked;x.updatedAt=new Date().toISOString();save();render()}
 d.querySelector('.toggle').onclick=()=>{x.open=!x.open;save();render()}
 d.querySelector('.edit').onclick=()=>{let v=prompt('할 일 수정',x.text);if(v!==null&&v.trim()){x.text=v.trim();x.updatedAt=new Date().toISOString();save();render()}}
 d.querySelector('.del').onclick=()=>{if(confirm('이 할일과 하위 항목을 삭제할까요?')){items=items.filter(i=>i.id!==x.id);save();render()}}
 let sl=d.querySelector('.sublist');x.subs.forEach(s=>{let r=document.createElement('div');r.className='subrow'+(s.done?' subdone':'');r.innerHTML=`<input class="subcheck" type="checkbox" ${s.done?'checked':''}><span class="submarker">›</span><div class="subtitle">${esc(s.text)}</div><button class="mini sdel">삭제</button>`;r.querySelector('.subcheck').onchange=e=>{s.done=e.target.checked;save();render()};r.querySelector('.sdel').onclick=()=>{x.subs=x.subs.filter(z=>z.id!==s.id);save();render()};sl.appendChild(r)})
 let inp=d.querySelector('.subadd input');function addSub(){let v=inp.value.trim();if(!v)return;let t=new Date().toISOString();x.subs.push({id:uid('s'),text:v,done:false,createdAt:t,updatedAt:t});x.open=true;save();render()}d.querySelector('.addsub').onclick=addSub;inp.onkeydown=e=>{if(e.key==='Enter')addSub()}

 d.addEventListener('dragstart',e=>{d.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',x.id)});
 d.addEventListener('dragend',()=>d.classList.remove('dragging'));
 d.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move'});
 d.addEventListener('drop',e=>{
   e.preventDefault();
   const fromId=e.dataTransfer.getData('text/plain');
   const from=items.find(i=>i.id===fromId), to=items.find(i=>i.id===x.id);
   if(!from||!to||from.id===to.id) return;
   const ordered=items.slice().sort((a,b)=>(a.order??0)-(b.order??0));
   const fromIdx=ordered.findIndex(i=>i.id===from.id), toIdx=ordered.findIndex(i=>i.id===to.id);
   ordered.splice(fromIdx,1); ordered.splice(toIdx,0,from);
   ordered.forEach((it,i)=>it.order=i);
   items=ordered;
   $('sort').value='custom'; localStorage.setItem(SORT,'custom');
   save(); render();
 });
 return d
}
function render(){let a=filtered(),act=a.filter(x=>!x.done),dn=a.filter(x=>x.done);for(let [arr,id,msg] of [[act,'active','할 일이 없습니다.'],[dn,'done','완료 항목이 없습니다.']]){let t=$(id);t.innerHTML='';if(!arr.length)t.innerHTML=`<div class="empty">${msg}</div>`;arr.forEach(x=>t.appendChild(build(x)))}}
function add(){let v=$('newText').value.trim();if(!v)return;let t=new Date().toISOString();items.push({id:uid(),text:v,done:false,open:false,subs:[],createdAt:t,updatedAt:t,order:items.length});$('newText').value='';save();render();$('newText').focus()}
$('addBtn').onclick=add;$('newText').onkeydown=e=>{if(e.key==='Enter')add()};$('search').oninput=render;$('sort').value=localStorage.getItem(SORT)||'new';$('sort').onchange=()=>{localStorage.setItem(SORT,$('sort').value);render()}
load();render();
</script></body></html>
