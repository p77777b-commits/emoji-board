<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARISE MEMO v0.3</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --text:#171717; --muted:#6b7280;
  --line:#dedede; --accent:#222; --danger:#b42318; --soft:#f0f1f3;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea{font:inherit}
header{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--line);padding:10px 14px
}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:1500px;margin:auto}
h1{font-size:18px;margin:0;white-space:nowrap}
.search{flex:1;min-width:220px;padding:9px 11px;border:1px solid #bbb;border-radius:9px}
.btn{border:1px solid #bbb;background:#fff;border-radius:9px;padding:8px 10px;cursor:pointer}
.btn.primary{background:#222;color:#fff;border-color:#222}
.btn.danger{color:var(--danger)}
.btn.ghost{background:#f8f8f8}
main{max-width:1500px;margin:auto;padding:10px}
.layout{display:grid;grid-template-columns:minmax(280px,36%) 1fr;gap:10px;min-height:calc(100vh - 84px)}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel-head{padding:10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.small{font-size:12px;color:var(--muted)}
.list{max-height:calc(100vh - 140px);overflow:auto}
.item{padding:11px;border-bottom:1px solid #eee;cursor:pointer;display:grid;grid-template-columns:24px 1fr;column-gap:6px}.item.dragging{opacity:.45}.drag{cursor:grab;color:#888;user-select:none;font-size:17px;padding-top:1px}.drag:active{cursor:grabbing}.itembody{min-width:0}
.item:hover{background:#fafafa}
.item.active{background:#f0f0f0}
.item-title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-preview{font-size:13px;color:#555;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px}
.item-meta{font-size:11px;color:#888;margin-top:5px}
.editor{padding:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.title{width:100%;padding:10px 11px;border:1px solid #bbb;border-radius:9px;font-weight:700}
.content{width:100%;min-height:48vh;resize:vertical;padding:12px;border:1px solid #bbb;border-radius:9px;line-height:1.55;margin-top:9px}
.tags{width:100%;padding:9px 11px;border:1px solid #bbb;border-radius:9px;margin-top:9px}
.actions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.empty{padding:40px 16px;text-align:center;color:#777}
.notice{padding:8px 10px;background:#fff8e1;border:1px solid #f3d58a;border-radius:9px;font-size:12px;margin-top:8px;display:none}
#toast{position:fixed;right:16px;bottom:16px;background:#111;color:#fff;padding:9px 12px;border-radius:9px;opacity:0;transform:translateY(8px);transition:.16s;z-index:50;pointer-events:none}
.settings{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.settings-card{width:min(520px,100%);background:#fff;border-radius:14px;padding:16px}
.settings-card h2{margin:0 0 12px}
.trash-list{max-height:260px;overflow:auto;border:1px solid #ddd;border-radius:9px;margin-top:10px}
.trash-item{padding:9px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:8px;align-items:center}
@media(max-width:820px){
  .layout{display:block}
  .list{max-height:none}
  .panel.editor-panel{display:none}
  body.mobile-edit .panel.list-panel{display:none}
  body.mobile-edit .panel.editor-panel{display:block}
  .content{min-height:52vh}
  .mobile-back{display:inline-block!important}
}
.mobile-back{display:none}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>📝 ARISE MEMO v0.3</h1>
    <input id="search" class="search" placeholder="검색: 제목 · 내용 · 태그">
    <select id="sortSelect" class="btn" aria-label="메모 정렬"><option value="custom">사용자 지정순</option>
      <option value="updatedDesc">최근 수정순</option>
      <option value="updatedAsc">오래된 수정순</option>
      <option value="createdDesc">최신 작성순</option>
      <option value="createdAsc">오래된 작성순</option>
      <option value="titleAsc">제목 가나다순</option>
    </select>
    <button id="newBtn" class="btn primary">+ 새 메모</button>
    <button id="settingsBtn" class="btn">⚙ 설정</button>
  </div>
</header>

<main>
  <div id="draftNotice" class="notice"></div>
  <div class="layout">
    <section class="panel list-panel">
      <div class="panel-head">
        <div>
          <strong>최근 메모</strong>
          <div class="small" id="countText">0개</div>
        </div>
      </div>
      <div id="memoList" class="list"></div>
    </section>

    <section class="panel editor-panel">
      <div class="panel-head">
        <div class="row">
          <button id="mobileBack" class="btn mobile-back">‹ 목록</button>
          <div>
            <strong id="editorMode">메모 선택</strong>
            <div class="small" id="editorMeta"></div>
          </div>
        </div>
      </div>
      <div class="editor">
        <input id="title" class="title" placeholder="제목 (비워두면 자동 생성)">
        <textarea id="content" class="content" placeholder="생각나는 내용을 바로 적으세요."></textarea>
        <input id="tags" class="tags" placeholder="태그 (선택)  예: ARISE, 출판, 아이디어">
        <div class="actions">
          <button id="copyBtn" class="btn ghost">내용 복사</button>
          <button id="deleteBtn" class="btn danger">삭제</button>
          <button id="saveBtn" class="btn primary">저장</button>
        </div>
      </div>
    </section>
  </div>
</main>

<div id="settings" class="settings">
  <div class="settings-card">
    <h2>⚙ 메모 관리</h2>
    <div class="row">
      <button id="exportBtn" class="btn">JSON 백업</button>
      <label class="btn" for="importFile">JSON 복원</label>
      <input id="importFile" type="file" accept=".json,application/json" hidden>
    </div>
    <h3>🗑 휴지통</h3>
    <div id="trashList" class="trash-list"></div>
    <div class="actions">
      <button id="emptyTrashBtn" class="btn danger">휴지통 비우기</button>
      <button id="closeSettingsBtn" class="btn primary">닫기</button>
    </div>
  </div>
</div>

<div id="toast">완료</div>

<script>
const KEY='ariseMemoV01';
const DRAFT_KEY='ariseMemoDraftV01';
const SORT_KEY='ariseMemoSortV01';
let memos=[], selectedId=null, isNew=false, draftTimer=null;

const $=id=>document.getElementById(id);
const els={
  search:$('search'), sortSelect:$('sortSelect'), newBtn:$('newBtn'), settingsBtn:$('settingsBtn'), memoList:$('memoList'),
  countText:$('countText'), editorMode:$('editorMode'), editorMeta:$('editorMeta'),
  title:$('title'), content:$('content'), tags:$('tags'), copyBtn:$('copyBtn'),
  deleteBtn:$('deleteBtn'), saveBtn:$('saveBtn'), toast:$('toast'), settings:$('settings'),
  exportBtn:$('exportBtn'), importFile:$('importFile'), trashList:$('trashList'),
  emptyTrashBtn:$('emptyTrashBtn'), closeSettingsBtn:$('closeSettingsBtn'),
  draftNotice:$('draftNotice'), mobileBack:$('mobileBack')
};

function nowISO(){ return new Date().toISOString(); }
function uid(){ return 'm_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
function saveStore(){ localStorage.setItem(KEY,JSON.stringify(memos)); }
function loadStore(){
  try{ memos=JSON.parse(localStorage.getItem(KEY)||'[]'); if(!Array.isArray(memos)) memos=[]; }catch(e){memos=[]} memos.forEach((x,i)=>{if(typeof x.order!=='number')x.order=i});
}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function showToast(msg){ els.toast.textContent=msg; els.toast.style.opacity=1; els.toast.style.transform='translateY(0)'; clearTimeout(window._tt); window._tt=setTimeout(()=>{els.toast.style.opacity=0;els.toast.style.transform='translateY(8px)'},900); }
function autoTitle(content){
  const clean=(content||'').replace(/\s+/g,' ').trim();
  return clean ? clean.slice(0,34)+(clean.length>34?'…':'') : '제목 없는 메모';
}
function fmtTime(iso){
  if(!iso) return '';
  const d=new Date(iso), n=new Date(), diff=n-d;
  if(diff<60000) return '방금 전';
  if(diff<3600000) return Math.floor(diff/60000)+'분 전';
  if(diff<86400000) return Math.floor(diff/3600000)+'시간 전';
  return d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function activeMemos(){
  const q=els.search.value.trim().toLowerCase();
  return memos.filter(m=>m.status!=='deleted').filter(m=>{
    if(!q) return true;
    return [m.title,m.content,(m.tags||[]).join(' ')].join(' ').toLowerCase().includes(q);
  }).sort((a,b)=>{
    switch(els.sortSelect.value){
      case 'custom': return (a.order??0)-(b.order??0);
      case 'updatedAsc': return new Date(a.updatedAt)-new Date(b.updatedAt);
      case 'createdDesc': return new Date(b.createdAt)-new Date(a.createdAt);
      case 'createdAsc': return new Date(a.createdAt)-new Date(b.createdAt);
      case 'titleAsc':
        return (a.title||autoTitle(a.content)).localeCompare(
          b.title||autoTitle(b.content),'ko',{numeric:true,sensitivity:'base'}
        );
      case 'updatedDesc':
      default: return new Date(b.updatedAt)-new Date(a.updatedAt);
    }
  });
}
function renderList(){
  const list=activeMemos(); els.countText.textContent=list.length+'개';
  els.memoList.innerHTML='';
  if(!list.length){ els.memoList.innerHTML='<div class="empty">메모가 없습니다.<br>+ 새 메모로 시작하세요.</div>'; return; }
  list.forEach(m=>{
    const div=document.createElement('div');
    div.className='item'+(m.id===selectedId?' active':'');
    div.draggable=true; div.dataset.id=m.id;
    div.innerHTML=`<span class="drag" title="드래그로 순서 변경">⋮⋮</span><div class="itembody"><div class="item-title">${esc(m.title||autoTitle(m.content))}</div>
      <div class="item-preview">${esc(m.content||'')}</div>
      <div class="item-meta">${fmtTime(m.updatedAt)}${m.tags?.length?' · #'+m.tags.map(esc).join(' #'):''}</div></div>`;
    div.onclick=()=>openMemo(m.id);
    div.addEventListener('dragstart',e=>{div.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',m.id)});
    div.addEventListener('dragend',()=>div.classList.remove('dragging'));
    div.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move'});
    div.addEventListener('drop',e=>{
      e.preventDefault(); e.stopPropagation();
      const fromId=e.dataTransfer.getData('text/plain');
      const from=memos.find(x=>x.id===fromId), to=memos.find(x=>x.id===m.id);
      if(!from||!to||from.id===to.id) return;
      const ordered=memos.slice().sort((a,b)=>(a.order??0)-(b.order??0));
      const fromIdx=ordered.findIndex(x=>x.id===from.id), toIdx=ordered.findIndex(x=>x.id===to.id);
      ordered.splice(fromIdx,1); ordered.splice(toIdx,0,from);
      ordered.forEach((x,i)=>x.order=i); memos=ordered;
      els.sortSelect.value='custom'; localStorage.setItem(SORT_KEY,'custom');
      saveStore(); renderList();
    });
    els.memoList.appendChild(div);
  });
}
function openMemo(id){
  const m=memos.find(x=>x.id===id); if(!m) return;
  selectedId=id; isNew=false;
  els.title.value=m.manualTitle?m.title:'';
  els.content.value=m.content||'';
  els.tags.value=(m.tags||[]).join(', ');
  els.editorMode.textContent='메모 수정';
  els.editorMeta.textContent='수정 '+fmtTime(m.updatedAt);
  document.body.classList.add('mobile-edit');
  renderList();
}
function clearEditor(){
  selectedId=null; isNew=true;
  els.title.value=''; els.content.value=''; els.tags.value='';
  els.editorMode.textContent='새 메모';
  els.editorMeta.textContent='내용만 입력해도 저장됩니다';
  document.body.classList.add('mobile-edit');
  renderList();
  setTimeout(()=>els.content.focus(),0);
}
function collect(){
  const content=els.content.value.trim(), rawTitle=els.title.value.trim();
  const tags=els.tags.value.split(',').map(x=>x.trim()).filter(Boolean);
  return {content, rawTitle, tags, title: rawTitle||autoTitle(content), manualTitle:!!rawTitle};
}
function saveMemo(){
  const d=collect();
  if(!d.content && !d.rawTitle){ showToast('내용을 입력하세요'); return; }
  if(selectedId && !isNew){
    const m=memos.find(x=>x.id===selectedId); if(!m) return;
    Object.assign(m,{title:d.title,manualTitle:d.manualTitle,content:d.content,tags:d.tags,updatedAt:nowISO()});
  }else{
    const t=nowISO(), m={id:uid(),title:d.title,manualTitle:d.manualTitle,content:d.content,tags:d.tags,createdAt:t,updatedAt:t,status:'active',syncState:'local'};
    m.order=memos.length; memos.push(m); selectedId=m.id; isNew=false;
  }
  saveStore(); localStorage.removeItem(DRAFT_KEY); els.draftNotice.style.display='none';
  showToast('저장됨'); renderList(); openMemo(selectedId);
}
function trashMemo(){
  if(!selectedId){ showToast('선택된 메모가 없습니다'); return; }
  const m=memos.find(x=>x.id===selectedId); if(!m) return;
  if(!confirm('이 메모를 휴지통으로 이동할까요?')) return;
  m.status='deleted'; m.deletedAt=nowISO(); m.updatedAt=nowISO(); saveStore();
  showToast('휴지통으로 이동'); selectedId=null; isNew=false;
  els.title.value=''; els.content.value=''; els.tags.value='';
  els.editorMode.textContent='메모 선택'; els.editorMeta.textContent='';
  document.body.classList.remove('mobile-edit'); renderList(); renderTrash();
}
function draftSave(){
  clearTimeout(draftTimer);
  draftTimer=setTimeout(()=>{
    const d={title:els.title.value,content:els.content.value,tags:els.tags.value,savedAt:nowISO(),selectedId,isNew};
    if(d.title||d.content||d.tags) localStorage.setItem(DRAFT_KEY,JSON.stringify(d));
  },350);
}
function checkDraft(){
  try{
    const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null'); if(!d||(!d.title&&!d.content&&!d.tags)) return;
    els.draftNotice.style.display='block';
    els.draftNotice.innerHTML=`작성 중이던 초안이 있습니다. <button id="restoreDraft" class="btn">복구</button> <button id="discardDraft" class="btn">버리기</button>`;
    $('restoreDraft').onclick=()=>{ clearEditor(); els.title.value=d.title||''; els.content.value=d.content||''; els.tags.value=d.tags||''; els.draftNotice.style.display='none'; showToast('초안 복구됨'); };
    $('discardDraft').onclick=()=>{localStorage.removeItem(DRAFT_KEY);els.draftNotice.style.display='none';};
  }catch(e){}
}
function renderTrash(){
  const trash=memos.filter(m=>m.status==='deleted').sort((a,b)=>new Date(b.deletedAt)-new Date(a.deletedAt));
  els.trashList.innerHTML='';
  if(!trash.length){els.trashList.innerHTML='<div class="empty">휴지통이 비어 있습니다.</div>';return}
  trash.forEach(m=>{
    const d=document.createElement('div'); d.className='trash-item';
    d.innerHTML=`<span>${esc(m.title||autoTitle(m.content))}</span><button class="btn">복구</button>`;
    d.querySelector('button').onclick=()=>{m.status='active';delete m.deletedAt;m.updatedAt=nowISO();saveStore();renderTrash();renderList();showToast('복구됨')};
    els.trashList.appendChild(d);
  });
}
function exportJSON(){
  const payload={version:'0.1',exportedAt:nowISO(),memos};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='ARISE_MEMO_backup_'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}
async function importJSON(file){
  try{
    const data=JSON.parse(await file.text()); const arr=Array.isArray(data)?data:data.memos;
    if(!Array.isArray(arr)) throw new Error();
    if(!confirm('현재 메모를 백업 파일 내용으로 교체할까요?')) return;
    memos=arr; saveStore(); selectedId=null; isNew=false; renderList(); renderTrash(); showToast('복원 완료');
  }catch(e){alert('올바른 ARISE MEMO JSON 백업 파일이 아닙니다.')}
}

els.newBtn.onclick=clearEditor;
els.saveBtn.onclick=saveMemo;
els.deleteBtn.onclick=trashMemo;
els.copyBtn.onclick=async()=>{
  const t=els.content.value; if(!t){showToast('복사할 내용이 없습니다');return}
  try{await navigator.clipboard.writeText(t)}catch(e){
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()
  }
  showToast('내용 복사됨')
};
els.search.oninput=renderList;
els.sortSelect.value=localStorage.getItem(SORT_KEY)||'updatedDesc';
els.sortSelect.onchange=()=>{
  localStorage.setItem(SORT_KEY,els.sortSelect.value);
  renderList();
};
['input','change'].forEach(ev=>{
  els.title.addEventListener(ev,draftSave); els.content.addEventListener(ev,draftSave); els.tags.addEventListener(ev,draftSave)
});
els.settingsBtn.onclick=()=>{renderTrash();els.settings.style.display='flex'};
els.closeSettingsBtn.onclick=()=>els.settings.style.display='none';
els.exportBtn.onclick=exportJSON;
els.importFile.onchange=e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value=''};
els.emptyTrashBtn.onclick=()=>{
  if(confirm('휴지통의 메모를 모두 영구 삭제할까요?')){
    memos=memos.filter(m=>m.status!=='deleted');saveStore();renderTrash();showToast('휴지통 비움')
  }
};
els.mobileBack.onclick=()=>document.body.classList.remove('mobile-edit');

loadStore(); renderList(); renderTrash(); checkDraft();
</script>
</body>
</html>
