<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARISE TOOLBOX v0.1</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Noto Sans KR",sans-serif;background:#f5f6f8;color:#171717}
.wrap{max-width:1100px;margin:auto;padding:16px}h1{font-size:22px}.search{width:100%;padding:11px;border:1px solid #bbb;border-radius:10px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;text-decoration:none;color:inherit}
.card:hover{box-shadow:0 3px 10px #0002}.ico{font-size:30px}.title{font-weight:700;margin-top:8px}.desc{font-size:12px;color:#666;margin-top:4px}
</style></head><body><div class="wrap"><h1>🧰 ARISE TOOLBOX</h1><input id="q" class="search" placeholder="도구 찾기">
<div id="grid" class="grid">
<a class="card" href="emoji.html" data-key="emoji 이모지 기호"><div class="ico">⌨️</div><div class="title">이모지·기호판</div><div class="desc">문자·기호·이모지 빠른 복사</div></a>
<a class="card" href="memo.html" data-key="memo 메모 기록"><div class="ico">📝</div><div class="title">메모</div><div class="desc">작성·검색·수정·백업</div></a>
<a class="card" href="todo.html" data-key="todo 할일 체크"><div class="ico">✅</div><div class="title">할일</div><div class="desc">빠른 추가·완료·검색·정렬</div></a>
<a class="card" href="guide.html" data-key="guide 사용법 도움말"><div class="ico">📘</div><div class="title">사용법·도움말</div><div class="desc">ARISE 사용·활용·문제해결</div></a>
</div></div><script>
const q=document.getElementById('q');q.oninput=()=>{const v=q.value.toLowerCase();document.querySelectorAll('.card').forEach(c=>c.style.display=!v||c.dataset.key.includes(v)||c.innerText.toLowerCase().includes(v)?'block':'none')}
</script></body></html>
