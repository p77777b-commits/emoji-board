<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARISE HOME v0.17</title><style>

:root{--bg:#f5f5f5;--card:#fff;--line:#dedede;--text:#171717;--muted:#6d6d6d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,'Noto Sans KR',sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:28px 18px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.back{color:#333;text-decoration:none;font-weight:700}.pill{font-size:12px;color:#666;border:1px solid #d6d6d6;border-radius:999px;padding:6px 9px;background:#fff}
h1{margin:0;font-size:30px}.sub{color:var(--muted);margin:7px 0 0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
input,textarea,select,button{font:inherit}input,textarea,select{width:100%;border:1px solid #ccc;border-radius:9px;padding:10px;background:#fff}
textarea{min-height:150px;resize:vertical}.btn{border:1px solid #bbb;background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.btn.primary{background:#222;color:#fff;border-color:#222}
.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:680px){.grid{grid-template-columns:1fr}.wrap{padding:18px 12px 44px}}

.hero{text-align:center;padding:14px 0 18px}.hero h1{font-size:34px;letter-spacing:.5px}.hero p{color:#666;margin:7px 0 0}
.search{max-width:720px;margin:0 auto 22px}.search input{font-size:16px;padding:13px 14px}
.section{margin-top:20px}.section h2{font-size:16px;margin:0 0 10px;color:#333}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{display:block;text-decoration:none;color:#111;background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px 10px;text-align:center;min-height:92px}
.tile:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.07)}.ico{font-size:27px;display:block;margin-bottom:8px}.label{font-weight:800}
.work{display:grid;grid-template-columns:1.35fr .65fr;gap:12px}.resume{padding:18px}.resume strong{font-size:18px}.meta{font-size:13px;color:#777;margin-top:7px;line-height:1.6}
.asset{grid-template-columns:repeat(4,minmax(0,1fr))}.foot{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:26px;font-size:13px}
.foot a{color:#555;text-decoration:none}
@media(max-width:720px){.tiles,.asset{grid-template-columns:repeat(2,1fr)}.work{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
