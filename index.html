<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>아름 이모지 · 문자 · 특수기호판</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#171717;--muted:#6b7280;--line:#dedede;--accent:#222}
*{box-sizing:border-box} body{margin:0;font-family:"Segoe UI Emoji","Segoe UI Symbol","Noto Sans KR","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);padding:10px 14px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap} h1{font-size:18px;margin:0;white-space:nowrap}.controlrow{margin-top:8px;display:flex;align-items:center;justify-content:flex-start;gap:0;flex-wrap:wrap}.controlgap{width:18px;flex:0 0 18px}
#search{flex:1;min-width:260px;padding:9px 11px;border:1px solid #bbb;border-radius:9px;font-size:15px}
.tabs,.density{display:flex;gap:5px;flex-wrap:wrap} button.ctrl{padding:8px 10px;border:1px solid #bbb;background:#fff;border-radius:9px;cursor:pointer}
button.ctrl.active{background:#222;color:#fff;border-color:#222}
.subbar{margin-top:7px;padding-top:7px;border-top:1px solid #ececec;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.cat{padding:6px 8px;border:1px solid #d3d3d3;background:#fff;border-radius:8px;cursor:pointer;font-size:13px}
.cat.active{background:#f0f0f0;font-weight:700}
.status{font-size:12px;color:var(--muted);margin-left:auto}
main{max-width:1680px;margin:auto;padding:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px;margin-bottom:9px}
h2{font-size:14px;margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:3px}
.char{height:36px;border:1px solid #e4e4e4;background:#fff;border-radius:7px;font-size:19px;cursor:pointer;line-height:1}
.char:hover{box-shadow:0 2px 7px #0002;transform:translateY(-1px)}
.emoji-grid .char{font-size:22px}
body.compact .grid{grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:2px}
body.compact .char{height:30px;font-size:16px;border-radius:6px}
body.compact .emoji-grid .char{font-size:19px}
body.large .grid{grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px}
body.large .char{height:46px;font-size:24px}
body.large .emoji-grid .char{font-size:29px}
#toast{position:fixed;right:16px;bottom:16px;z-index:50;background:#111;color:#fff;padding:9px 12px;border-radius:9px;opacity:0;transform:translateY(8px);transition:.16s;pointer-events:none}
#emojiArea{display:none}
.loading{padding:18px;text-align:center;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}
@media(max-width:720px){header{padding:8px} h1{font-size:16px} main{padding:7px} .status{width:100%;margin-left:0}}

.controlgap{width:18px;flex:0 0 18px}.workbar{margin-top:7px;padding:7px 0;border-top:1px solid #ececec;border-bottom:1px solid #ececec;display:grid;gap:5px}.workline{display:flex;align-items:center;gap:7px;min-height:31px;overflow:hidden}.worklabel{font-size:12px;font-weight:700;color:#555;min-width:66px}.currentglyph{font-size:24px;min-width:30px;text-align:center}.currentmeta,.modecrumb{font-size:12px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.recentstrip{display:flex;gap:4px;overflow-x:auto}.recentbtn{flex:0 0 auto;width:31px;height:31px;border:1px solid #ddd;background:#fff;border-radius:7px;font-size:18px;cursor:pointer}.presetArea{display:none}.preset-card{background:#fff;border:1px solid #dedede;border-radius:11px;padding:9px;margin-bottom:9px}.preset-row,.processline{display:flex;gap:4px;flex-wrap:wrap;align-items:center}.preset-item{min-width:40px;height:38px;padding:0 7px;border:1px solid #e4e4e4;background:#fff;border-radius:7px;font-size:20px;cursor:pointer}.process-chip{padding:7px 9px;border:1px solid #e3e3e3;background:#fff;border-radius:8px;cursor:pointer}.copyflow{margin-left:auto;padding:7px 9px;border:1px solid #bbb;background:#f7f7f7;border-radius:8px;cursor:pointer;font-weight:700}.backtop{position:fixed;right:14px;bottom:14px;z-index:40;width:42px;height:42px;border:1px solid #bbb;background:#fff;border-radius:50%;box-shadow:0 2px 9px #0002;cursor:pointer;font-size:18px;display:none}.ctrl.preset-active{background:#222;color:#fff;border-color:#222}

/* v1.1 preset layout */
#presetArea[data-mode="status"],
#presetArea[data-mode="meaning"]{
  display:grid !important;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
  align-items:start;
}
#presetArea[data-mode="status"] .preset-card,
#presetArea[data-mode="meaning"] .preset-card{
  margin-bottom:0;
}
#presetArea[data-mode="process"]{
  display:block;
}
@media(max-width:820px){
  #presetArea[data-mode="status"],
  #presetArea[data-mode="meaning"]{
    grid-template-columns:1fr;
  }
}
</style>
</head>

  if((v==='emoji'||v==='all')&&!emojiLoaded) loadEmoji();
  buildCategoryBar(); filter();
}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));

document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('active',x===b));
  document.body.classList.remove('compact','large');
  if(b.dataset.size==='compact') document.body.classList.add('compact');
  if(b.dataset.size==='large') document.body.classList.add('large');
  localStorage.setItem('areumEmojiDensity',b.dataset.size);
});
const saved=localStorage.getItem('areumEmojiDensity');
if(saved) document.querySelector(`[data-size="${saved}"]`)?.click();

function buildCategoryBar(){
  categoryBar.innerHTML='';
  const items=[];
  if(currentView!=='emoji') document.querySelectorAll('.symbol-panel').forEach(s=>items.push([s.dataset.label,s]));
  if(currentView!=='symbol' && emojiLoaded) document.querySelectorAll('.emoji-panel').forEach(s=>items.push([s.dataset.label,s]));
  items.forEach(([name,el])=>{
    const b=document.createElement('button'); b.className='cat'; b.textContent=name;
    b.onclick=()=>el.scrollIntoView({behavior:'smooth',block:'start'});
    categoryBar.appendChild(b);
  });
  const st=document.createElement('span'); st.className='status';
  st.textContent=emojiLoaded ? `Emoji ${allEmoji.length.toLocaleString()}개 로드됨` : '문자·기호 우선 배열';
  categoryBar.appendChild(st);
}

function parseEmojiText(txt){
  const groups={}; let group='';
  for(const line of txt.split(/\r?\n/)){
    if(line.startsWith('# group:')){group=line.slice(8).trim(); if(!groups[group]) groups[group]=[]; continue;}
    if(!line.includes('; fully-qualified')) continue;
    const m=line.match(/;\s*fully-qualified\s*#\s*(\S+)\s+E[0-9.]+\s+(.*)$/);
    if(!m||!group) continue;
    groups[group].push({emoji:m[1],name:m[2]});
  }
  return groups;
}
function renderGroups(groups, sourceLabel){
  emojiSections.innerHTML=''; allEmoji=[];
  for(const [g,arr] of Object.entries(groups)){
    if(!arr.length) continue;
    const sec=document.createElement('section'); sec.className='panel emoji-panel'; sec.dataset.kind='emoji';
    sec.dataset.label=GROUP_KO[g]||g;
    const h=document.createElement('h2'); h.textContent=(GROUP_KO[g]||g)+` · ${arr.length}`;
    const grid=document.createElement('div'); grid.className='grid emoji-grid';
    for(const item of arr){
      const b=document.createElement('button'); b.className='char'; b.dataset.char=item.emoji;
      b.dataset.search=(item.name+' '+g).toLowerCase(); b.title=item.name; b.textContent=item.emoji;
      grid.appendChild(b); allEmoji.push(item);
    }
    sec.append(h,grid); emojiSections.appendChild(sec);
  }
  loading.style.display='none'; emojiLoaded=true; buildCategoryBar(); filter();
  const note=document.createElement('div'); note.className='small'; note.style.margin='4px 4px 12px';
  note.textContent=sourceLabel; emojiSections.prepend(note);
}
function fallbackGroups(){
  const obj={};
  for(const [cat,chars] of FALLBACK) obj[cat]=chars.map(x=>({emoji:x,name:cat}));
  return obj;
}
async function loadEmoji(){
  loading.style.display='block';
  try{
    const r=await fetch(UNICODE_URL,{cache:'force-cache'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const groups=parseEmojiText(await r.text());
    renderGroups(groups,'Unicode Emoji 17.0 공식 emoji-test 데이터 기반 · 피부색/ZWJ/국기 포함');
  }catch(e){
    renderGroups(fallbackGroups(),'공식 목록 연결 실패로 내장 기본 이모지를 표시 중 · 인터넷 연결 후 새로고침하면 FULL 목록을 다시 시도합니다.');
  }
}

function filter(){
  const q=search.value.trim().toLowerCase();
  document.querySelectorAll('.symbol-panel').forEach(sec=>{
    if(currentView==='emoji'){sec.style.display='none';return}
    const show=!q || sec.dataset.label.toLowerCase().includes(q) || sec.innerText.toLowerCase().includes(q);
    sec.style.display=show?'block':'none';
  });
  document.querySelectorAll('.emoji-panel').forEach(sec=>{
    if(currentView==='symbol'){sec.style.display='none';return}
    let visible=0;
    sec.querySelectorAll('.char').forEach(b=>{
      const show=!q || b.dataset.search.includes(q) || b.dataset.char.includes(q);
      b.style.display=show?'':'none'; if(show) visible++;
    });
    sec.style.display=visible?'block':'none';
  });
}
search.addEventListener('input',filter);
buildCategoryBar();

const presetArea=document.getElementById('presetArea'),currentGlyph=document.getElementById('currentGlyph'),currentMeta=document.getElementById('currentMeta'),recentStrip=document.getElementById('recentStrip'),modeCrumb=document.getElementById('modeCrumb'),backTop=document.getElementById('backTop');
let presetMode=null,recentUsed=[];try{recentUsed=JSON.parse(localStorage.getItem('areumRecentUsed')||'[]')}catch(e){}
function rememberUse(ch,label=''){currentGlyph.textContent=ch;currentMeta.textContent=(label?label+' · ':'')+'복사됨';recentUsed=recentUsed.filter(x=>x.ch!==ch);recentUsed.unshift({ch,label});recentUsed=recentUsed.slice(0,40);localStorage.setItem('areumRecentUsed',JSON.stringify(recentUsed));renderRecent()}
function renderRecent(){recentStrip.innerHTML='';recentUsed.forEach(x=>{let b=document.createElement('button');b.className='recentbtn';b.textContent=x.ch;b.title=x.label||x.ch;b.onclick=()=>{copyChar(x.ch);rememberUse(x.ch,x.label)};recentStrip.appendChild(b)})}renderRecent();
document.addEventListener('click',e=>{let b=e.target.closest('.char');if(b)setTimeout(()=>rememberUse(b.dataset.char,b.title||''),0)},true);
function renderPreset(mode){presetMode=mode;presetArea.dataset.mode=mode;document.querySelectorAll('[data-preset]').forEach(b=>b.classList.toggle('preset-active',b.dataset.preset===mode));document.querySelectorAll('[data-view]').forEach(b=>b.classList.remove('active'));symbolArea.style.display='none';emojiArea.style.display='none';presetArea.style.display=(mode==='status'||mode==='meaning')?'grid':'block';presetArea.innerHTML='';let src=mode==='status'?STATUS_PRESETS:mode==='meaning'?MEANING_PRESETS:PROCESS_PRESETS;modeCrumb.textContent=mode==='status'?'상태별':mode==='meaning'?'의미별':'공정별';for(const [name,data] of Object.entries(src)){let c=document.createElement('section');c.className='preset-card';c.dataset.label=name;let h=document.createElement('h2');h.textContent=name;c.appendChild(h);let row=document.createElement('div');row.className=mode==='process'?'processline':'preset-row';if(mode!=='process'){data.split(' ').forEach(ch=>{let b=document.createElement('button');b.className='preset-item';b.textContent=ch;b.title=name;b.onclick=()=>{copyChar(ch);rememberUse(ch,name)};row.appendChild(b)})}else{data.forEach(([ch,label],i)=>{let b=document.createElement('button');b.className='process-chip';b.textContent=ch+' '+label;b.onclick=()=>{copyChar(ch);rememberUse(ch,name+' > '+label)};row.appendChild(b);if(i<data.length-1){let a=document.createElement('span');a.textContent='→';row.appendChild(a)}});let full=data.map(([ch,l])=>ch+' '+l).join(' → '),cp=document.createElement('button');cp.className='copyflow';cp.textContent='전체 복사';cp.onclick=()=>{navigator.clipboard?.writeText(full).catch(()=>fallbackCopy(full));showToast('공정 전체');currentGlyph.textContent='✓';currentMeta.textContent=name+' · 전체 공정 복사됨'};row.appendChild(cp)}c.appendChild(row);presetArea.appendChild(c)}buildPresetBar()}
function buildPresetBar(){categoryBar.innerHTML='';presetArea.querySelectorAll('.preset-card').forEach(sec=>{let b=document.createElement('button');b.className='cat';b.textContent=sec.dataset.label;b.onclick=()=>{modeCrumb.textContent=(presetMode==='status'?'상태별':presetMode==='meaning'?'의미별':'공정별')+' > '+sec.dataset.label;sec.scrollIntoView({behavior:'smooth',block:'start'})};categoryBar.appendChild(b)})}
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>renderPreset(b.dataset.preset));
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{presetMode=null;presetArea.style.display='none';presetArea.removeAttribute('data-mode');document.querySelectorAll('[data-preset]').forEach(x=>x.classList.remove('preset-active'));modeCrumb.textContent=b.dataset.view==='all'?'전체':b.dataset.view==='symbol'?'문자·기호':'그림·이모지 FULL'}));
search.addEventListener('input',()=>{if(!presetMode)return;let q=search.value.trim().toLowerCase();presetArea.querySelectorAll('.preset-card').forEach(c=>c.style.display=!q||c.innerText.toLowerCase().includes(q)?'block':'none')});
window.addEventListener('scroll',()=>backTop.style.display=window.scrollY>500?'block':'none');backTop.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
</script>
</body>
</html>
