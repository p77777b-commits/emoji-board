<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#171717;--line:#ddd;--accent:#222}
*{box-sizing:border-box} body{margin:0;font-family:"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:14px 18px}
h1{font-size:20px;margin:0 0 10px} .toolbar{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:220px;padding:11px 13px;border:1px solid #bbb;border-radius:10px;font-size:16px}
.filter{padding:9px 12px;border:1px solid #bbb;background:#fff;border-radius:10px;cursor:pointer}
.filter.active{background:#222;color:white}
main{padding:18px;max-width:1500px;margin:auto} section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 16px}
h2{font-size:16px;margin:0 0 10px} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.char{height:48px;font-size:24px;border:1px solid #e2e2e2;background:#fff;border-radius:9px;cursor:pointer}
.char:hover{transform:translateY(-1px);box-shadow:0 2px 8px #0002} .emoji .char{font-size:28px}
#toast{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:10px 14px;border-radius:10px;opacity:0;transition:.18s;pointer-events:none}
.note{font-size:13px;color:#666;margin-top:8px}
.skin{padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);font-size:22px}
@media(max-width:600px){main{padding:10px}.grid{grid-template-columns:repeat(auto-fill,minmax(43px,1fr))}}
</style>
</head>

<div id="toast">복사됨</div>
<script>
const q=document.querySelector('#q'), toast=document.querySelector('#toast');
let kind='전체';
function apply(){
 const term=q.value.trim().toLowerCase();
 document.querySelectorAll('section').forEach(s=>{
   const okKind=kind==='전체'||s.dataset.kind===kind;
   const text=(s.dataset.cat+' '+s.innerText).toLowerCase();
   s.style.display=(okKind && (!term||text.includes(term)))?'block':'none';
 });
}
q.addEventListener('input',apply);
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active')); b.classList.add('active');
 kind=b.dataset.filter; apply();
});
document.querySelectorAll('.char').forEach(b=>b.onclick=async()=>{
 const ch=b.dataset.char;
 try{await navigator.clipboard.writeText(ch)}catch(e){
   const t=document.createElement('textarea');t.value=ch;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();
 }
 toast.textContent='복사됨: '+ch;toast.style.opacity=1;setTimeout(()=>toast.style.opacity=0,850);
});
</script>
</body></html>
